name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HAS_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: 准备 Android 工程
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> android/local.properties
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            sed -i 's#https://pub.flutter-io.cn#https://pub.dev#g' pubspec.lock
            printf 'pluginRepositories=\ndependencyRepositories=\n' > android/gradle/repositories.local.properties
            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-bin.zip' \
              > android/gradle/wrapper/gradle-wrapper.properties
          fi
          flutter pub get

      - name: 恢复固定签名
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android > /dev/null

      - name: 读取版本名
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: 校验 tag 与版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${APP_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 pubspec 版本 v${APP_VERSION} 不一致"
            exit 1
          fi

      - name: 构建 release APK
        run: |
          flutter build apk --release --no-pub --no-shrink \
            --target-platform android-arm64 \
            --build-name="${APP_VERSION}+${GITHUB_RUN_NUMBER}" \
            --build-number="$((GITHUB_RUN_NUMBER + 10000))"

      - name: 整理产物
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/audio-player_v${APP_VERSION}+${GITHUB_RUN_NUMBER}.apk"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.apk
          retention-days: 14
          overwrite: true

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: apk-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.apk \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
